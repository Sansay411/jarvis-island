<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- JARVIS mark: an amber eye-pill that bends into the success arc — a «J». -->
  <defs>
    <linearGradient id="surface" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1A1F"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="rim" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE2B0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="amber" x1="32" y1="15" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD27A"/>
      <stop offset="0.55" stop-color="#FFB23F"/>
