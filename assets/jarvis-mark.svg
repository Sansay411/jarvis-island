  <path d="M32 .5 C46 .5 53 .5 58.25 5.75 C63.5 11 63.5 18 63.5 32 C63.5 46 63.5 53 58.25 58.25 C53 63.5 46 63.5 32 63.5 C18 63.5 11 63.5 5.75 58.25 C.5 53 .5 46 .5 32 C.5 18 .5 11 5.75 5.75 C11 .5 18 .5 32 .5 Z" fill="url(#surface)" stroke="url(#rim)" stroke-width="1"/>
  <path d="M38.5 19.5 V36 A10.5 10.5 0 0 1 17.5 36" stroke="#FFB23F" stroke-opacity="0.6" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M38.5 19.5 V36 A10.5 10.5 0 0 1 17.5 36" stroke="url(#amber)" stroke-width="9" stroke-linecap="round"/>
