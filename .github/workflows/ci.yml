name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Drop sherpa-onnx build output whose libraries the cache pruned
        shell: bash
        run: |
          if ! find src-tauri/target/sherpa-onnx-prebuilt \( -name 'libsherpa-onnx-c-api.a' -o -name 'sherpa-onnx-c-api.lib' \) 2>/dev/null | grep -q .; then
            rm -rf src-tauri/target/sherpa-onnx-prebuilt src-tauri/target/*/build/sherpa-onnx-sys-* src-tauri/target/*/*/build/sherpa-onnx-sys-*
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: cargo check --all-targets
        working-directory: src-tauri

      - run: cargo test --lib
        working-directory: src-tauri

      - name: Check the Windows setup window
        if: runner.os == 'Windows'
        run: cargo check --manifest-path installer/Cargo.toml
