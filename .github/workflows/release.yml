# Builds the Windows installer and a portable exe, then attaches both to a
# GitHub release. Runs on a version tag (git tag v0.1.0 && git push --tags)
# or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe out/
          Copy-Item src-tauri/target/release/jarvis.exe out/jarvis-portable.exe
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-x64
          path: out/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Jarvis ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
