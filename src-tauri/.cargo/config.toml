# The sherpa-onnx static libraries (speech recognition and synthesis) are
# built against the static MSVC runtime (/MT); linking them into a /MD binary
# fails. Link the whole app statically against the CRT instead — this also
# removes the VC++ Redistributable dependency from the installer.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
