[package]
name = "jarvis-setup"
version = "0.3.1"
description = "Установщик и удаление Джарвиса"
edition = "2021"
publish = false

# Built on its own (`cargo build --release` in this folder) after the app:
# JARVIS_PAYLOAD points at the NSIS package Tauri produced, which is embedded
# and run silently. Without it the window opens with nothing to install.
#
# `jarvis-uninstall` is built *before* the app: the NSIS hook in
# src-tauri/windows/hooks.nsh copies it into the install folder and registers
# it as the uninstaller in «Apps & features».

[lib]
name = "jarvis_setup"
path = "src/lib.rs"

[[bin]]
name = "jarvis-setup"
path = "src/main.rs"

[[bin]]
name = "jarvis-uninstall"
path = "src/uninstall.rs"

[dependencies]
tao = "=0.37.1"
wry = "=0.57.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_Registry",
  "Win32_System_RestartManager",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
