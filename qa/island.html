<!doctype html><html lang="ru"><meta charset="utf-8"><title>Jarvis UI QA</title>
<style>body{margin:0;background:#333;color:#fff}#controls{position:fixed;bottom:20px;left:20px;display:flex;gap:12px;z-index:1000}button{padding:12px}#root{width:640px;height:600px;margin:auto}</style>
<div id="root"></div><div id="controls"><button id="open">Открыть тестовый чат</button><button id="close">Закрыть тестовый чат</button><output id="status">Тестовая страница, системные действия отключены</output></div>
<script type="module">
let callbackId=0;
const callbacks=new Map();
window.__TAURI_EVENT_PLUGIN_INTERNALS__={unregisterListener(){}};
window.__TAURI_INTERNALS__={
 metadata:{currentWindow:{label:'island'},currentWebview:{label:'island'}},
 transformCallback(fn){const id=++callbackId;callbacks.set(id,fn);return id},
 unregisterCallback(id){callbacks.delete(id)},
 async invoke(cmd,args){
  if(cmd==='plugin:event|listen')return ++callbackId;
  if(cmd==='island_context')return {topCovered:false};
  if(cmd==='audio_get')return {volume:30,muted:false,device:'QA'};
  if(cmd==='brightness_list')return [];
  return null;
 }
};
const [{createRoot},React,{Island},{useIsland},{useAgent}]=await Promise.all([
 import('react-dom/client'),import('react'),import('/src/island/Island.tsx'),import('/src/store/island.ts'),import('/src/store/agent.ts')
]);
await import('/src/styles/tokens.css');await import('/src/styles/base.css');
useAgent.setState({status:{configured:true,provider:'QA',model:'Тестовая модель',problem:null},items:Array.from({length:80},(_,i)=>({kind:i%2?'assistant':'user',id:String(i),turnId:'qa',text:'Тестовое сообщение '+i,streaming:false,attachments:[]}))});
createRoot(document.getElementById('root')).render(React.createElement(Island));
document.getElementById('open').onclick=()=>useIsland.getState().set({workspaceOpen:true});
document.getElementById('close').onclick=()=>useIsland.getState().set({workspaceOpen:false,hovered:false});
</script></html>
